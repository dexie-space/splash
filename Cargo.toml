[package]
name = "splash"
version = "0.2.0"
edition = "2021"
authors = ["dns <dns@dexie.space>"]
description = "A decentralized network for sharing offers across the Chia ecosystem"
license = "MIT"
homepage = "https://dexie.space/splash"
repository = "https://github.com/dexie-space/splash"
keywords = ["p2p", "dexie", "chia", "blockchain", "crypto"]

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
libp2p = { version = "0.57.1", features = [ "tokio", "gossipsub", "kad", "noise", "macros", "identify", "tcp", "yamux", "secp256k1", "ed25519"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "system-proxy"] }
warp = { version = "0.4.3", features = ["server"] }
bech32 = "0.12.0"
hickory-resolver = "0.26.3"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = "0.11.11"
